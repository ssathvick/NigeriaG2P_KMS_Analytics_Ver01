apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name | quote }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name | quote }}}
      annotations:
        checksum/config: {{ .Values.deploymentConfig | sha256sum }}
    spec:
      securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: experience
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef: {name: {{ .Values.existingSecret | quote }}}
          env:
            - {name: EXPERIENCE_CONFIG, value: /app/config/deployment.json}
            - {name: EXPERIENCE_DATABASE, value: /app/data/knowledge.sqlite}
          ports: [{name: http, containerPort: 18110}]
          readinessProbe:
            exec: {command: [python, tools/healthcheck.py]}
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            exec: {command: [python, tools/healthcheck.py]}
            initialDelaySeconds: 45
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /app/config, readOnly: true}
            - {name: data, mountPath: /app/data}
            - {name: tmp, mountPath: /tmp}
        - name: collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, tools/collector_entry.py]
          envFrom:
            - secretRef: {name: {{ .Values.existingSecret | quote }}}
          env:
            - {name: EXPERIENCE_CONFIG, value: /app/config/deployment.json}
            - {name: EXPERIENCE_DATABASE, value: /app/data/knowledge.sqlite}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /app/config, readOnly: true}
            - {name: data, mountPath: /app/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: {{ .Release.Name }}-config}
        - name: data
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-data}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
