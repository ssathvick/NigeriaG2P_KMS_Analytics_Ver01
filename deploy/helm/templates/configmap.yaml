apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  deployment.json: |
{{ required "Supply --set-file deploymentConfig=config/deployment.json" .Values.deploymentConfig | indent 4 }}
{{- range $key, $value := .Values.certificates }}
  {{ $key }}: |
{{ $value | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.storage.className }}
  storageClassName: {{ .Values.storage.className | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size | quote }}
