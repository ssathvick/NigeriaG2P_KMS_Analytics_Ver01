{% extends 'base.html' %}{% block content %}<h1>Change password</h1><p>This changes your experience-layer account only. You will sign in again afterward.</p>{% if error %}<p role="alert">{{error}}</p>{% endif %}<form method="post" class="card"><input type="hidden" name="csrf" value="{{csrf}}"><label>Current password<input name="current_password" type="password" autocomplete="current-password" required></label><label>New password<input name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><label>Confirm new password<input name="confirm_password" type="password" autocomplete="new-password" required></label><button>Change password</button></form>{% endblock %}
